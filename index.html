<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#17233d" />
    <title>PokéSlot — Máquina</title>
    <meta name="description" content="Gire os rolos de Kanto, capture Pokémon e complete sua Pokédex no arcade de Caetano Coimbra." />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/preview/style.css" />
    <link rel="stylesheet" href="/src/preview/arcade.css" />
    <link rel="stylesheet" href="/src/preview/arcade-scenery.css" />
    <link rel="stylesheet" href="/src/preview/dex-cards.css" />
    <link rel="stylesheet" href="/src/preview/inventory-arcade.css" />
  </head>
  <body class="arcade">
    <div class="arcade-scenery" aria-hidden="true"><i class="arcade-moon"></i><i class="arcade-ridge"></i><i class="arcade-woods"></i></div>
    <main class="shell">
      <header class="topbar">
        <span class="brand">
          <img src="/favicon.svg" alt="" width="35" height="35" />
          <span class="brand-name">Poké<span>Slot</span></span>
        </span>
        <nav class="arcade-nav" aria-label="Áreas do jogo">
          <a href="#maquina" data-screen-link="machine" aria-current="page"><span class="nav-icon" aria-hidden="true"></span><span data-text="navMachine">Máquina</span></a>
          <a href="#pokedex" data-screen-link="pokedex"><span class="nav-icon" aria-hidden="true"></span><span data-text="navPokedex">Pokédex</span></a>
          <a href="#vales" data-screen-link="vouchers"><span class="nav-icon" aria-hidden="true"></span><span data-text="navVouchers">Vales</span></a>
          <a href="#pedras" data-screen-link="stones"><span class="nav-icon" aria-hidden="true"></span><span data-text="navStones">Pedras</span></a>
        </nav>
        <div class="topbar-actions">
          <details id="proof-auth" class="proof-auth account-menu" hidden>
            <summary id="account-label" class="account-label"></summary>
            <div class="account-panel">
              <form id="proof-login" method="post" hidden>
                <label><span data-text="emailLabel"></span><input name="email" type="email" autocomplete="username" required></label>
                <label><span data-text="passwordLabel"></span><input id="login-password" name="password" type="password" autocomplete="current-password" required></label>
                <button type="submit" data-text="loginButton"></button>
                <button id="open-proof-signup" type="button" data-text="showSignup" hidden></button>
                <a id="open-password-recovery" data-text="passwordRecovery"></a>
              </form>
              <form id="proof-signup" method="post" hidden>
                <p id="proof-signup-note" data-text="signupNote"></p>
                <label><span data-text="signupName"></span><input name="name" type="text" maxlength="60" autocomplete="off" required></label>
                <label><span data-text="emailLabel"></span><input name="email" type="email" autocomplete="username" placeholder="jogador@example.test" required></label>
                <label><span data-text="signupPassword"></span><input id="signup-password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></label>
                <button type="submit" data-text="signupButton"></button>
                <button id="open-proof-login" type="button" data-text="showLogin"></button>
              </form>
              <p id="proof-user" tabindex="-1"></p>
              <button id="proof-logout" type="button" data-text="logoutButton" hidden></button>
              <p id="proof-auth-status" role="status"></p>
            </div>
          </details>
          <button id="language" class="language" type="button" lang="en" aria-label="EN — Switch to English">EN</button>
        </div>
      </header>
      <section class="machine" data-screen="machine" aria-labelledby="machine-title">
        <div class="cabinet">
          <div class="marquee"><i aria-hidden="true"></i><h1 id="machine-title" data-text="machineTitle" tabindex="-1">Kanto Spin</h1><i aria-hidden="true"></i></div>
          <div class="grid" id="grid" role="group"></div>
          <div class="control-deck">
            <div class="credit-meter"><span data-text="credits"></span><strong id="demo-balance" role="status"></strong></div>
            <button id="spin" class="spin-button" type="button" data-text="spinButton" aria-describedby="empty-balance"></button>
          </div>
          <div class="cabinet-feedback">
            <p id="status" class="status" role="status"></p>
            <p id="empty-balance" class="status" role="status" hidden></p>
            <button id="sound-toggle" data-sound-toggle type="button" aria-pressed="true" hidden><span aria-hidden="true">♪</span> <span class="sound-label">Som</span> <span class="sound-state" aria-hidden="true"></span></button>
          </div>
        </div>
        <aside class="console-side">
        <section class="paytable"><h2 data-text="paytable"></h2>
          <dl>
            <div><dt><i class="reel-icon icon-pokeball" aria-hidden="true"><i class="icon-center"></i></i><span data-text="ballLine"></span></dt><dd data-text="ballPrize"></dd></div>
            <div><dt><i class="reel-icon icon-spin" aria-hidden="true"><i class="icon-center"></i></i><span data-text="spinLine"></span></dt><dd data-text="spinPrize"></dd></div>
            <div><dt><i class="reel-icon icon-voucher" aria-hidden="true"><i class="icon-center"></i></i><span data-text="ticketLine"></span></dt><dd data-text="ticketPrize"></dd></div>
          </dl>
        </section>
        <div class="round-readout">
        <div class="reward-preview" aria-live="polite">
          <h2 data-text="rewardHeading"></h2>
          <ul id="rewards"></ul>
        </div>
        <p id="proof-rewards" class="status"></p>
        </div>
        <p id="next-refill" class="status"></p>
        <button id="refresh-balance" type="button" data-text="refreshBalance"></button>
        </aside>
      </section>
      <section id="demo-vouchers" class="inventory-console" data-screen="vouchers" aria-labelledby="voucher-title" hidden>
        <header class="inventory-header">
          <div><h1 id="voucher-title" data-text="vouchersTitle" tabindex="-1"></h1><p data-text="vouchersNote"></p></div>
          <div class="ticket-fan" aria-hidden="true"><i></i><i></i><i></i></div>
        </header>
        <div class="inventory-body">
          <section class="inventory-shelf"><h2 data-text="voucherInventoryTitle"></h2>
            <ul id="voucher-inventory" class="voucher-wallet"></ul>
            <a class="inventory-link" href="#pedras" data-text="visitStones"></a>
          </section>
          <div class="inventory-workbench voucher-workbench">
            <form id="demo-redeem" class="demo-redeem inventory-action">
              <h2 data-text="redeemTitle"></h2>
              <p data-text="redeemNote"></p>
              <label><span data-text="redeemSpecies"></span><select name="speciesId" id="redeem-species" required aria-describedby="redeem-choice"></select></label>
              <p id="redeem-names-status" role="status"></p>
              <button id="retry-redeem-names" type="button" data-text="retryNames" hidden></button>
              <p id="redeem-choice" aria-live="polite"></p>
              <button id="redeem-submit" type="submit" data-text="redeemButton"></button>
              <p id="redeem-status" role="status"></p>
            </form>
            <section class="voucher-receipt">
              <h2 data-text="voucherRoundTitle"></h2>
              <ul id="voucher-results"></ul><p id="voucher-results-empty"></p>
            </section>
          </div>
        </div>
      </section>
      <section id="demo-stones" class="inventory-console" data-screen="stones" aria-labelledby="stone-title" hidden>
        <header class="inventory-header">
          <div><h1 id="stone-title" tabindex="-1"></h1><p id="stone-note"></p></div>
          <div class="crystal-cluster" aria-hidden="true"><i class="gem gem-water"></i><i class="gem gem-moon"></i><i class="gem gem-leaf"></i></div>
        </header>
        <div class="inventory-body">
          <section class="inventory-shelf"><h2 id="stone-inventory-title"></h2>
            <ul id="stone-inventory" class="stone-tray"></ul>
          </section>
          <p id="stone-recovery-message" role="status" hidden></p>
          <button id="stone-recover-button" type="button" hidden></button>
          <div class="inventory-workbench">
            <form id="stone-exchange" class="demo-redeem inventory-action">
              <h2 id="stone-exchange-title"></h2>
              <p id="stone-stock"></p>
              <div class="stone-picker"><i id="stone-preview" class="gem" aria-hidden="true"></i>
                <label><span id="stone-choice-label"></span><select id="stone-choice" required aria-describedby="stone-stock"></select></label>
              </div>
              <button id="stone-exchange-button" type="submit" aria-describedby="stone-stock"></button>
            </form>
            <form id="stone-evolve" class="demo-redeem inventory-action">
              <h2 id="stone-evolve-title"></h2>
              <label><span id="stone-evolution-label"></span><select id="stone-evolution-choice" required aria-describedby="stone-evolution-info"></select></label>
              <p id="stone-evolution-info"></p>
              <button id="stone-evolve-button" type="submit" aria-describedby="stone-evolution-info"></button>
            </form>
          </div>
          <p id="stone-action-status" role="status"></p>
        </div>
      </section>
      <section id="kanto-pokedex" class="pokedex" data-screen="pokedex" aria-labelledby="pokedex-title" hidden>
        <header class="dex-head">
          <div class="dex-headline"><span class="dex-lens" aria-hidden="true"></span>
            <h1 id="pokedex-title" data-text="pokedexTitle" tabindex="-1"></h1>
          </div>
          <p class="pokedex-note" data-text="pokedexNote"></p>
        <div class="collection-progress">
          <label for="kanto-progress" id="progress-label"></label>
          <progress id="kanto-progress" max="151" value="0"></progress>
          <p id="variant-progress"></p>
          <p id="kanto-complete" role="status"></p>
        </div>
        </header>
        <div class="pokedex-content">
          <div class="dex-tools">
            <button id="pokedex-sound-toggle" data-sound-toggle type="button" aria-pressed="true" hidden><span aria-hidden="true">♪</span> <span class="sound-label">Som</span> <span class="sound-state" aria-hidden="true"></span></button>
          </div>
          <div class="collection-filters" role="search">
            <label><span data-text="numberFilter"></span><input id="collection-number" type="search" maxlength="40" placeholder="#025" autocomplete="off"></label>
            <label><span data-text="variantFilter"></span><select id="collection-variant"><option value="all" data-text="allVariants"></option><option value="normal" data-text="normal"></option><option value="shiny" data-text="shiny"></option></select></label>
          </div>
          <div class="dex-filter-group" role="group" aria-labelledby="collection-registration-label">
            <span id="collection-registration-label" data-text="registrationFilter"></span>
            <div id="collection-registration" class="dex-filter-buttons">
              <button type="button" data-registration="all" data-text="allRegistrations" aria-pressed="true"></button>
              <button type="button" data-registration="owned" data-text="capturedFilter" aria-pressed="false"></button>
              <button type="button" data-registration="missing" data-text="uncapturedFilter" aria-pressed="false"></button>
            </div>
          </div>
          <div class="dex-filter-group" role="group" aria-labelledby="collection-rarity-label">
            <span id="collection-rarity-label" data-text="rarityFilter"></span>
            <div id="collection-rarity" class="dex-filter-buttons">
              <button type="button" data-rarity="all" data-text="allRarities" aria-pressed="true"></button>
              <button type="button" data-rarity="common" data-text="commonRarity" aria-pressed="false"></button>
              <button type="button" data-rarity="uncommon" data-text="uncommonRarity" aria-pressed="false"></button>
              <button type="button" data-rarity="rare" data-text="rareRarity" aria-pressed="false"></button>
              <button type="button" data-rarity="legendary" data-text="legendaryRarity" aria-pressed="false"></button>
            </div>
          </div>
          <p id="filter-count" role="status"></p>
        <section id="pokemon-detail" class="pokemon-detail" aria-labelledby="selected-pokemon" hidden>
          <h2 id="selected-pokemon" tabindex="-1"></h2>
          <button id="back-to-card" type="button" data-text="backToCatalog"></button>
          <img id="pokemon-sprite" width="96" height="96" alt="" hidden />
          <p id="sprite-status"></p>
          <div id="detail-variants" class="detail-variants" role="group">
            <button type="button" data-variant="normal" aria-pressed="false"></button>
            <button type="button" data-variant="shiny" aria-pressed="false"></button>
          </div>
          <p id="capture-rarity"></p>
          <p id="variant-path"></p>
          <p id="evolution-path"></p>
          <button id="open-redemption" type="button" class="retry-detail" data-text="viewRedemption" hidden></button>
          <p id="detail-status" role="status"></p>
          <div id="detail-content" hidden>
            <p id="pokemon-types"></p>
            <p id="pokemon-description"></p>
            <p id="description-source" class="description-source"></p>
          </div>
          <button id="retry-detail" class="retry-detail" type="button" data-text="retry" hidden></button>
        </section>
          <ul id="collection"></ul>
          <p id="empty-collection"></p>
          <details class="dex-captures">
            <summary data-text="lastCaptures"></summary>
            <ul id="capture-results"></ul>
            <p id="no-captures"></p>
          </details>
        </div>
        <template id="dex-card">
          <li><button type="button" class="collection-entry">
            <span class="dex-number"></span>
            <span class="dex-display" aria-hidden="true"><img width="96" height="96" alt=""></span>
            <span class="dex-name"></span><span class="dex-variants"></span>
          </button></li>
        </template>
      </section>
      <footer class="game-footer"><a id="about-project" href="/case/" data-text="aboutProject">Sobre o projeto</a></footer>
    </main>
    <dialog id="capture-dialog" aria-labelledby="capture-dialog-title" aria-describedby="capture-dialog-intro">
      <div class="capture-dialog-content">
        <p class="capture-dialog-kicker" id="capture-dialog-intro"></p>
        <h2 id="capture-dialog-title" aria-live="polite"></h2>
        <ul id="capture-dialog-list" aria-live="polite"></ul>
        <button id="capture-dialog-close" type="button" autofocus></button>
      </div>
    </dialog>
    <dialog id="guest-intro" class="guest-intro" aria-labelledby="guest-speaker" aria-describedby="guest-spoken">
      <div class="guest-scene">
        <img alt="" width="320" height="480" hidden />
        <span class="guest-portrait-fallback" aria-hidden="true">PC</span>
        <button class="guest-close" type="button" aria-label="Fechar introdução">×</button>
      </div>
      <div class="guest-balloon">
        <h2 id="guest-speaker" class="guest-speaker">Professor Coimbra</h2>
        <p class="guest-dialogue-visual" aria-hidden="true"></p>
        <p id="guest-spoken" class="guest-dialogue-spoken" aria-live="polite" aria-atomic="true"></p>
        <span class="guest-progress"></span>
      </div>
      <div class="guest-actions">
        <button class="guest-skip" type="button">Ir para o cadastro</button>
        <button class="guest-next" type="button" autofocus>Continuar</button>
      </div>
    </dialog>
    <script type="module" src="/src/preview/main.js"></script>
  </body>
</html>
