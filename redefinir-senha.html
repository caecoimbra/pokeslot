<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PokéSlot — redefinir senha</title>
    <meta name="theme-color" content="#17233d" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/preview/style.css" />
    <link rel="stylesheet" href="/src/preview/arcade.css" />
  </head>
  <body class="arcade recovery-page">
    <main class="shell">
      <header class="topbar">
        <span class="brand">
          <img src="/favicon.svg" alt="" width="35" height="35" />
          <span class="brand-name">Poké<span>Slot</span></span>
        </span>
        <button id="language" class="language" type="button" lang="en" aria-label="EN — Switch to English">EN</button>
      </header>
      <section class="proof-auth" aria-labelledby="recovery-title">
        <h1 id="recovery-title" data-text="title">Redefinir senha</h1>
        <form id="request-link" method="post" hidden>
          <label><span data-text="email"></span><input name="email" type="email" autocomplete="email" required></label>
          <button type="submit" data-text="send"></button>
        </form>
        <form id="reset-password" method="post" hidden>
          <label><span data-text="password"></span><input id="reset-new-password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></label>
          <label><span data-text="confirm"></span><input id="reset-confirmation" name="confirmation" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></label>
          <button type="submit" data-text="save"></button>
        </form>
        <p id="recovery-status" role="status" tabindex="-1"></p>
        <a id="create-recovery-test-account" hidden data-text="createTestAccount"></a>
        <a id="return-to-machine" href="/" data-text="back">Voltar à máquina</a>
      </section>
    </main>
    <script type="module" src="/src/preview/redefinir-senha.js"></script>
  </body>
</html>
