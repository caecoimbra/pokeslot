<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#17233d" />
    <title>PokéSlot — prévia da máquina</title>
    <link rel="stylesheet" href="/src/preview/style.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <span class="brand">POKÉ<span>SLOT</span></span>
        <button id="language" class="language" type="button" aria-label="Switch to English">EN</button>
      </header>
      <section class="intro">
        <p class="eyebrow" data-text="eyebrow"></p>
        <h1 data-text="title"></h1>
        <p data-text="intro"></p>
      </section>
      <section id="proof-auth" class="proof-auth" hidden>
        <h2 data-text="authTitle"></h2>
        <form id="proof-login">
          <label><span data-text="emailLabel"></span><input name="email" type="email" autocomplete="username" required></label>
          <label><span data-text="passwordLabel"></span><input name="password" type="password" autocomplete="current-password" required></label>
          <button type="submit" data-text="loginButton"></button>
        </form>
        <p id="proof-user"></p><button id="proof-logout" type="button" data-text="logoutButton" hidden></button>
        <p id="proof-auth-status" role="status"></p>
      </section>
      <section class="machine" aria-labelledby="machine-title">
        <div class="machine-header">
          <div><span class="light"></span><span data-text="machineLabel"></span></div>
          <span>03 × 03</span>
        </div>
        <h2 id="machine-title" data-text="machineTitle"></h2>
        <div class="grid" id="grid" role="group"></div>
        <div class="results" aria-live="polite">
          <span data-text="results"></span>
          <strong id="lines"></strong>
        </div>
        <div class="reward-preview" aria-live="polite">
          <h3 data-text="rewardHeading"></h3>
          <ul id="rewards"></ul>
          <p id="no-rewards"></p>
        </div>
        <p id="demo-balance" class="status" role="status"></p>
        <p id="next-refill" class="status"></p>
        <button id="refresh-balance" type="button" data-text="refreshBalance"></button>
        <p id="proof-rewards" class="status"></p>
        <button id="spin" class="spin-button" type="button" data-text="spinButton"></button>
        <p id="status" class="status" role="status"></p>
        <p class="caption" data-text="caption"></p>
      </section>
      <section id="demo-vouchers" class="pokedex" hidden>
        <h2 data-text="vouchersTitle"></h2>
        <p class="pokedex-note" data-text="vouchersNote"></p>
        <h3 data-text="voucherRoundTitle"></h3>
        <ul id="voucher-results"></ul><p id="voucher-results-empty"></p>
        <h3 data-text="voucherInventoryTitle"></h3>
        <ul id="voucher-inventory"></ul><p id="voucher-inventory-empty"></p>
        <form id="demo-redeem" class="demo-redeem">
          <h3 data-text="redeemTitle"></h3>
          <p data-text="redeemNote"></p>
          <label><span data-text="redeemSpecies"></span><select name="speciesId" id="redeem-species" required aria-describedby="redeem-choice"></select></label>
          <p id="redeem-choice" aria-live="polite"></p>
          <button id="redeem-submit" type="submit" data-text="redeemButton"></button>
          <p id="redeem-status" role="status"></p>
        </form>
      </section>
      <section class="pokedex" aria-labelledby="pokedex-title">
        <p class="eyebrow" data-text="pokedexEyebrow"></p>
        <h2 id="pokedex-title" data-text="pokedexTitle"></h2>
        <p class="pokedex-note" data-text="pokedexNote"></p>
        <div class="collection-progress">
          <label for="kanto-progress" id="progress-label"></label>
          <progress id="kanto-progress" max="151" value="0"></progress>
          <p id="shiny-progress"></p>
        </div>
        <div class="pokedex-content" aria-live="polite">
          <h3 data-text="lastCaptures"></h3>
          <ul id="capture-results"></ul>
          <p id="no-captures"></p>
          <h3 data-text="collectionTitle"></h3>
          <div class="collection-filters">
            <label><span data-text="numberFilter"></span><input id="collection-number" type="text" inputmode="numeric" maxlength="4" placeholder="#025" autocomplete="off"></label>
            <label><span data-text="variantFilter"></span><select id="collection-variant"><option value="all" data-text="allVariants"></option><option value="normal" data-text="normal"></option><option value="shiny" data-text="shiny"></option></select></label>
          </div>
          <p id="filter-count" role="status"></p>
          <ul id="collection"></ul>
          <p id="empty-collection"></p>
        </div>
        <div id="pokemon-detail" class="pokemon-detail" hidden>
          <h3 data-text="detailsTitle"></h3>
          <p id="detail-status" role="status"></p>
          <div id="detail-content" hidden>
            <img id="pokemon-sprite" width="96" height="96" alt="" hidden />
            <p id="sprite-status"></p>
            <p id="pokemon-name"></p>
            <p id="pokemon-types"></p>
            <p id="pokemon-description"></p>
            <p id="description-source" class="description-source"></p>
          </div>
          <button id="retry-detail" class="retry-detail" type="button" data-text="retry" hidden></button>
        </div>
      </section>
      <p class="footnote" data-text="footnote"></p>
    </main>
    <script type="module" src="/src/preview/main.js"></script>
  </body>
</html>
